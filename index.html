
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080B12">
  <title>PCS - Red Social</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080B12;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      font-size: 65px;
      font-weight: 900;
      color: #1684FF;
      letter-spacing: 5px;
      margin-bottom: 10px;
      text-shadow: 0 0 25px #1684FF66;
    }

    .subtitle {
      color: #A5ADBA;
      font-size: 14px;
      margin-bottom: 45px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 12px;
    }

    .description {
      color: #929BAA;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .primary {
      background: #1684FF;
      color: white;
    }

    .secondary {
      background: #171D29;
      color: white;
      border: 1px solid #283346;
    }

    .footer {
      color: #687386;
      font-size: 12px;
      margin-top: 35px;
    }

    #authPanel {
      margin-top: 25px;
    }

    #authPanel[hidden] {
      display: none;
    }

    #authPanel h2 {
      margin-bottom: 20px;
    }

    #authPanel input {
      width: 100%;
      padding: 15px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid #283346;
      background: #171D29;
      color: white;
      font-size: 15px;
    }

    #authMessage {
      margin-top: 15px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">PCS</div>

    <p class="subtitle">CONECTA. COMPARTE. DESCUBRE.</p>

    <h1>Bienvenido a PCS</h1>

    <p class="description">
      Un nuevo espacio para compartir tus momentos,
      descubrir contenido y conectar con personas
      de todo el mundo.
    </p>

    <button class="btn primary" id="registerBtn">
      Crear una cuenta
    </button>

    <button class="btn secondary" id="loginBtn">
      Iniciar sesión
    </button>

    <section id="authPanel" hidden>
      <h2 id="authTitle">Crear una cuenta</h2>

      <form id="authForm">
        <input id="email" type="email"
          placeholder="Correo electrónico" required>

        <input id="password" type="password"
          placeholder="Contraseña" required minlength="6">

        <button class="btn primary" type="submit">
          Registrarme
        </button>
      </form>

      <p id="authMessage" aria-live="polite"></p>
    </section>

  </main>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMlrOplXMBEEraQTqWClISC12vIPveqRQ",
      authDomain: "pcsd-b01e1.firebaseapp.com",
      projectId: "pcsd-b01e1",
      storageBucket: "pcsd-b01e1.firebasestorage.app",
      messagingSenderId: "372951248604",
      appId: "1:372951248604:web:4d28e537c76b5aa5708e19"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const panel = document.getElementById("authPanel");
    const title = document.getElementById("authTitle");
    const form = document.getElementById("authForm");
    const message = document.getElementById("authMessage");
    const email = document.getElementById("email");
    const password = document.getElementById("password");

    let mode = "register";

    document.getElementById("registerBtn").addEventListener("click", () => {
      mode = "register";
      title.textContent = "Crear una cuenta";
      form.querySelector("button").textContent = "Registrarme";
      message.textContent = "";
      panel.hidden = false;
    });

    document.getElementById("loginBtn").addEventListener("click", () => {
      mode = "login";
      title.textContent = "Iniciar sesión";
      form.querySelector("button").textContent = "Entrar";
      message.textContent = "";
      panel.hidden = false;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      message.textContent = "Procesando...";

      try {
        if (mode === "register") {
          await createUserWithEmailAndPassword(
            auth,
            email.value,
            password.value
          );

          message.textContent = "¡Cuenta creada correctamente!";
        } else {
          await signInWithEmailAndPassword(
            auth,
            email.value,
            password.value
          );

          message.textContent = "¡Sesión iniciada correctamente!";
        }
      } catch (error) {
        message.textContent = "Error: " + error.message;
      }
    });

    console.log("Firebase conectado correctamente");

  </script>

</body>
</html>
