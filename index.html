  <style>
    * {
      margin: 0;
      padding: 0;

      font-family: Arial, sans-serif;

    body {
      background: #080B12;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;

    .container {

      margin-bottom: 35px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .primary {
      background: #1684FF;
      color: white;
    }

    .secondary {
      background: #171D29;
      color: white;
      border: 1px solid #283346;
    }

    .footer {
      color: #687386;
      font-size: 12px;
      margin-top: 35px;
    }
